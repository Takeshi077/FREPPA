<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | FREPPA GROUP OF SCHOOLS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: { extend: { colors: { slate: { 800: '#1b6b1b', 900: '#228B22', 950: '#165916' } } } }
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white no-print">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3 group">
                <img src="freppa logo.svg.png" alt="Logo" class="w-8 h-8 object-contain group-hover:rotate-12 transition-transform">
                <span class="font-bold text-lg tracking-tight">FREPPA DASHBOARD</span>
            </a>
            <div class="flex items-center space-x-4">
                <span id="nav-username" class="text-sm text-amber-400 font-medium hidden"></span>
                <button onclick="logout()" class="text-sm text-slate-300 hover:text-amber-400 transition-colors">
                    <i class="fa-solid fa-sign-out-alt mr-1"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8">
        <!-- Alerts -->
        <div id="error-message" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm mb-6"></div>

        <!-- Profile Card -->
        <div id="profile-card" class="bg-white rounded-2xl shadow-md border border-slate-100 p-6 mb-8">
            <div class="flex items-center space-x-4">
                <div class="w-16 h-16 bg-amber-500 rounded-full flex items-center justify-center text-slate-950 text-2xl font-bold" id="avatar-letter">S</div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900" id="profile-name">Loading...</h1>
                    <p class="text-slate-500 text-sm" id="profile-detail">Admission: ... | Class: ...</p>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-2xl shadow-md border border-slate-100 p-6 mb-6">
            <div class="flex flex-wrap gap-4 items-end">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Session</label>
                    <select id="filter-session" class="px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                        <option value="">All Sessions</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Term</label>
                    <select id="filter-term" class="px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                        <option value="">All Terms</option>
                    </select>
                </div>
                <button id="filter-btn" class="bg-amber-500 text-slate-950 hover:bg-amber-600 font-bold px-5 py-2 rounded-lg transition-all">
                    <i class="fa-solid fa-filter mr-1"></i> Filter
                </button>
                <button id="print-btn" class="bg-slate-900 text-white hover:bg-slate-800 font-bold px-5 py-2 rounded-lg transition-all">
                    <i class="fa-solid fa-print mr-1"></i> Print / PDF
                </button>
            </div>
        </div>

        <!-- Summary -->
        <div id="summary-card" class="hidden bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 rounded-2xl shadow-md p-6 mb-6">
            <div class="grid grid-cols-3 gap-4 text-center">
                <div>
                    <p class="text-3xl font-bold" id="summary-subjects">0</p>
                    <p class="text-sm font-semibold opacity-75">Subjects</p>
                </div>
                <div>
                    <p class="text-3xl font-bold" id="summary-total">0.00</p>
                    <p class="text-sm font-semibold opacity-75">Total Score</p>
                </div>
                <div>
                    <p class="text-3xl font-bold" id="summary-average">0.00</p>
                    <p class="text-sm font-semibold opacity-75">Average</p>
                </div>
            </div>
        </div>

        <!-- Results Table -->
        <div class="bg-white rounded-2xl shadow-md border border-slate-100 overflow-hidden">
            <div class="p-4 bg-slate-50 border-b border-slate-100">
                <h2 class="font-bold text-slate-900">My Results</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900 text-white text-sm">
                            <th class="p-3">Subject</th>
                            <th class="p-3">Code</th>
                            <th class="p-3 w-20">CA Score</th>
                            <th class="p-3 w-20">Exam Score</th>
                            <th class="p-3 w-20">Total</th>
                            <th class="p-3 w-16">Grade</th>
                            <th class="p-3">Remarks</th>
                            <th class="p-3">Term</th>
                        </tr>
                    </thead>
                    <tbody id="results-tbody" class="divide-y divide-slate-200 text-sm">
                        <tr><td colspan="8" class="p-6 text-center text-slate-400">Loading results...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/dashboard.js"></script>
    <script>
        if (!requireRole('student', 'parent')) throw new Error('Redirecting');

        const user = getUser();
        const isParent = user.role === 'parent';
        let selectedChildId = null;

        // Show parent child selector if parent
        if (isParent) {
            document.getElementById('profile-card').innerHTML = `
                <h2 class="text-lg font-bold text-slate-900 mb-4">Select Child</h2>
                <select id="child-select" class="w-full md:w-96 px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                    <option value="">-- Select your child --</option>
                </select>
            `;
        } else {
            document.getElementById('nav-username').textContent = user.full_name;
            document.getElementById('nav-username').classList.remove('hidden');
        }

        async function loadProfile() {
            try {
                if (isParent) return;
                const data = await apiFetch('/api/student/profile');
                const s = data.student;
                document.getElementById('profile-name').textContent = s.full_name;
                document.getElementById('profile-detail').textContent = `Admission: ${s.admission_number} | Class: ${s.class_name} - ${s.section}`;
                document.getElementById('avatar-letter').textContent = s.full_name.charAt(0).toUpperCase();
            } catch (e) {
                document.getElementById('error-message').textContent = e.message;
                document.getElementById('error-message').classList.remove('hidden');
            }
        }

        async function loadFilters() {
            try {
                const endpoint = isParent && selectedChildId
                    ? `/api/parent/child/${selectedChildId}/results`
                    : '/api/student/results';
                const data = await apiFetch(endpoint);

                const sessionSelect = document.getElementById('filter-session');
                const termSelect = document.getElementById('filter-term');

                sessionSelect.innerHTML = '<option value="">All Sessions</option>';
                termSelect.innerHTML = '<option value="">All Terms</option>';

                (data.sessions || []).forEach(s => {
                    sessionSelect.innerHTML += `<option value="${s.id}" ${s.is_current ? 'selected' : ''}>${s.session_name}</option>`;
                });
                (data.terms || []).forEach(t => {
                    termSelect.innerHTML += `<option value="${t.id}" ${t.is_current ? 'selected' : ''}>${t.term_name}</option>`;
                });
            } catch (e) {
                console.error('Failed to load filters:', e);
            }
        }

        async function loadResults() {
            const session = document.getElementById('filter-session')?.value || '';
            const term = document.getElementById('filter-term')?.value || '';
            const tbody = document.getElementById('results-tbody');

            tbody.innerHTML = '<tr><td colspan="8" class="p-6 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading...</td></tr>';

            try {
                let endpoint;
                if (isParent && selectedChildId) {
                    endpoint = `/api/parent/child/${selectedChildId}/results?session=${session}&term=${term}`;
                } else {
                    endpoint = `/api/student/results?session=${session}&term=${term}`;
                }

                const data = await apiFetch(endpoint);

                if (!data.results || data.results.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="p-6 text-center text-slate-400">No results found for the selected filters.</td></tr>';
                    document.getElementById('summary-card').classList.add('hidden');
                    return;
                }

                tbody.innerHTML = '';
                data.results.forEach(r => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 transition-colors';
                    tr.innerHTML = `
                        <td class="p-3 font-medium text-slate-900">${r.subject_name}</td>
                        <td class="p-3 text-slate-500">${r.subject_code}</td>
                        <td class="p-3">${r.ca_score ?? '-'}</td>
                        <td class="p-3">${r.exam_score ?? '-'}</td>
                        <td class="p-3 font-bold text-slate-900">${r.total_score ?? '-'}</td>
                        <td class="p-3"><span class="inline-block px-2 py-0.5 rounded text-xs font-bold ${getGradeClass(r.grade)}">${r.grade || '-'}</span></td>
                        <td class="p-3 text-slate-600 text-xs max-w-xs">${r.remarks || '-'}</td>
                        <td class="p-3 text-xs text-slate-400">${r.term_name}</td>
                    `;
                    tbody.appendChild(tr);
                });

                // Summary
                if (data.summary) {
                    document.getElementById('summary-subjects').textContent = data.summary.total_subjects;
                    document.getElementById('summary-total').textContent = data.summary.total_score;
                    document.getElementById('summary-average').textContent = data.summary.average;
                    document.getElementById('summary-card').classList.remove('hidden');
                }

            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-red-500">${e.message}</td></tr>`;
            }
        }

        // Event handlers
        document.getElementById('filter-btn')?.addEventListener('click', loadResults);
        document.getElementById('print-btn')?.addEventListener('click', () => window.print());

        // Init
        async function init() {
            if (isParent) {
                try {
                    const data = await apiFetch('/api/parent/children');
                    const select = document.getElementById('child-select');
                    (data.students || []).forEach(s => {
                        select.innerHTML += `<option value="${s.student_id}">${s.full_name} (${s.class_name})</option>`;
                    });
                    select.addEventListener('change', function() {
                        selectedChildId = this.value;
                        if (selectedChildId) {
                            document.getElementById('profile-card').classList.add('hidden');
                            loadFilters();
                            loadResults();
                        }
                    });
                    document.getElementById('profile-card').classList.remove('hidden');
                    document.getElementById('profile-card').innerHTML = '<h2 class="text-lg font-bold text-slate-900">Parent Dashboard</h2><p class="text-slate-500">Select a child above to view their results.</p>';
                } catch (e) {
                    document.getElementById('error-message').textContent = e.message;
                    document.getElementById('error-message').classList.remove('hidden');
                }
            } else {
                await loadProfile();
                await loadFilters();
                await loadResults();
            }
        }

        init();
    </script>
</body>
</html>
