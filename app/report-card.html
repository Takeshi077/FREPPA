<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Card | FREPPA GROUP OF SCHOOLS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: { extend: { colors: { slate: { 800: '#1b6b1b', 900: '#228B22', 950: '#165916' } } } }
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
    <style>
        :root {
            --rc-green: #1b6b1b;
            --rc-green-dark: #145014;
            --rc-green-soft: #eef7ee;
            --rc-line: #c9d9c9;
            --rc-ink: #1f2937;
            --rc-muted: #475569;
            --rc-gold: #a16207;
        }

        body { font-family: 'Outfit', sans-serif; }

        .report-shell {
            width: 210mm;
            max-width: 100%;
            margin: 0 auto;
            padding: 20px 0 36px;
        }

        .rc {
            box-sizing: border-box;
            width: 100%;
            min-height: 297mm;
            margin: 0 auto;
            padding: 12mm 12mm 12mm;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 12px 34px rgba(20, 70, 20, .14);
            color: var(--rc-ink);
            font-family: 'Outfit', 'Segoe UI', Arial, sans-serif;
            font-size: 11px;
            font-weight: 500;
            line-height: 1.28;
        }

        .rc-head {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 9px;
            margin-bottom: 10px;
            border-bottom: 2.5px solid var(--rc-green);
        }
        .rc-logo { width: 56px; height: 56px; object-fit: contain; flex: none; }
        .rc-head-text { flex: 1; text-align: center; }
        .rc-head h1 {
            margin: 0;
            font-size: 21px;
            font-weight: 700;
            letter-spacing: .8px;
            line-height: 1.1;
            color: var(--rc-green);
        }
        .rc-head p { margin: 2px 0 0; font-size: 10.5px; font-weight: 500; color: var(--rc-muted); }
        .rc-tag {
            flex: none;
            padding: 5px 9px;
            border: 1px solid var(--rc-green);
            border-radius: 5px;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: .8px;
            line-height: 1.35;
            text-align: center;
            color: var(--rc-green);
        }

        .rc-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 7px 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--rc-green-dark), #2f8f2f);
            color: #fff;
        }
        .rc-title strong { font-size: 15px; letter-spacing: 3px; font-weight: 700; }
        .rc-title span { font-size: 10.5px; letter-spacing: .3px; opacity: .95; }

        .rc-info {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 7px 12px;
            padding: 11px 12px;
            margin-bottom: 11px;
            border: 1px solid var(--rc-line);
            border-radius: 6px;
            background: var(--rc-green-soft);
        }
        .rc-info-item { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
        .rc-info-item span {
            flex: none;
            font-size: 9.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .4px;
            color: var(--rc-muted);
        }
        .rc-info-item strong {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--rc-ink);
            overflow-wrap: anywhere;
        }

        .rc-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .rc-table th {
            padding: 7px 4px;
            background: var(--rc-green);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            line-height: 1.25;
            text-align: center;
        }
        .rc-table th:nth-child(2), .rc-table td:nth-child(2) { text-align: left; }
        .rc-table td {
            padding: 6px 4px;
            border-bottom: 1px solid #e6ede6;
            font-size: 10.5px;
            font-weight: 500;
            text-align: center;
        }
        .rc-table tbody tr:nth-child(even) { background: #f7faf7; }
        .rc-table .rc-subject { font-weight: 600; color: #143214; }
        .rc-empty { padding: 16px !important; text-align: center !important; color: var(--rc-muted); }

        .rc-badge {
            display: inline-block;
            min-width: 21px;
            padding: 1.5px 4px;
            border-radius: 3px;
            font-size: 9.5px;
            font-weight: 700;
            line-height: 1.3;
        }
        .rc-badge--a { background: #dcfce7; color: #166534; }
        .rc-badge--b { background: #dbeafe; color: #1e40af; }
        .rc-badge--c { background: #fef3c7; color: #92400e; }
        .rc-badge--d { background: #ffedd5; color: #9a3412; }
        .rc-badge--e { background: #fee2e2; color: #991b1b; }
        .rc-badge--f { background: #fecaca; color: #7f1d1d; }

        .rc-summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 9px;
            margin: 11px 0;
        }
        .rc-stat {
            padding: 9px 5px;
            border: 1px solid #f0d9a8;
            border-radius: 6px;
            background: #fffaf0;
            text-align: center;
        }
        .rc-stat b { display: block; font-size: 18px; line-height: 1.15; color: var(--rc-gold); }
        .rc-stat b small { font-size: 10px; font-weight: 500; color: var(--rc-muted); }
        .rc-stat span {
            display: block;
            margin-top: 2px;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: var(--rc-muted);
        }

        .rc-lower {
            display: grid;
            grid-template-columns: 1.06fr 1fr;
            gap: 11px;
            align-items: start;
        }
        .rc-panel {
            padding: 11px 12px;
            border: 1px solid var(--rc-line);
            border-radius: 6px;
        }
        .rc-panel + .rc-panel { margin-top: 9px; }
        .rc-panel h2 {
            margin: 0 0 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--rc-line);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .8px;
            text-transform: uppercase;
            color: var(--rc-green-dark);
        }
        .rc-domain-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px 9px;
        }
        .rc-domain {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            font-size: 10px;
            font-weight: 500;
            white-space: nowrap;
        }
        .rc-domain span { overflow: hidden; text-overflow: ellipsis; }
        .rc-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
            margin-top: 8px;
            font-size: 9px;
            color: var(--rc-muted);
        }
        .rc-attendance { display: flex; gap: 16px; font-size: 10.5px; }
        .rc-attendance strong { color: var(--rc-green-dark); }

        .rc-remark-row {
            display: flex;
            gap: 8px;
            padding: 5px 0;
            border-bottom: 1px dashed #e2e8e2;
            font-size: 10.5px;
        }
        .rc-remark-row:last-child { border-bottom: 0; }
        .rc-remark-row span {
            flex: none;
            width: 112px;
            font-weight: 700;
            color: var(--rc-muted);
        }
        .rc-remark-row strong { font-weight: 600; overflow-wrap: anywhere; }

        .rc-sign {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 12px;
        }
        .rc-sign p {
            margin: 0 0 16px;
            padding-bottom: 3px;
            border-bottom: 1px solid #94a394;
            font-size: 10px;
            font-weight: 600;
            color: var(--rc-muted);
        }
        .rc-sign div:last-child { text-align: right; }
        .rc-sign span { font-size: 9px; color: var(--rc-muted); }

        .rc-foot {
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid var(--rc-line);
            font-size: 9px;
            text-align: center;
            color: #94a394;
        }

        @page { size: A4 portrait; margin: 0; }

        @media print {
            html, body {
                display: block !important;
                width: auto !important;
                min-height: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
                overflow: visible !important;
            }
            body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .no-print { display: none !important; }
            main {
                display: block !important;
                width: auto !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .report-shell {
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .rc {
                width: 100% !important;
                min-height: 0 !important;
                margin: 0 !important;
                padding: 12mm 12mm 10mm !important;
                border-radius: 0 !important;
                box-shadow: none !important;
            }
            .rc-head, .rc-title, .rc-info, .rc-summary,
            .rc-lower, .rc-panel, .rc-sign, .rc-foot {
                break-inside: avoid;
                page-break-inside: avoid;
            }
            .rc-table thead { display: table-header-group; }
            .rc-table tr { break-inside: avoid; page-break-inside: avoid; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col overflow-x-hidden">
    <header class="bg-slate-900 text-white no-print">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="student-dashboard.html" class="flex items-center space-x-3 group">
                <img src="freppa logo.svg.png" alt="Logo" class="w-8 h-8 object-contain">
                <span class="font-bold text-sm md:text-lg tracking-tight logo-text-dashboard">FREPPA REPORT CARD</span>
            </a>
            <div class="flex items-center space-x-4">
                <span id="nav-username" class="text-sm text-amber-400 font-medium hidden"></span>
                <a href="change-password.html" class="text-sm text-slate-300 hover:text-amber-400 transition-colors">
                    <i class="fa-solid fa-key mr-1"></i> Password
                </a>
                <button onclick="logout()" class="text-sm text-slate-300 hover:text-amber-400 transition-colors">
                    <i class="fa-solid fa-sign-out-alt mr-1"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-3 md:px-4 py-6 md:py-8 overflow-x-hidden">
        <div id="error-message" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm mb-6 no-print"></div>
        <div id="loading-message" class="text-center py-12 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><p class="mt-2">Loading report card...</p></div>

        <div class="flex flex-col sm:flex-row flex-wrap gap-3 sm:gap-4 items-stretch sm:items-end mb-6 no-print">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Session</label>
                <select id="filter-session" class="px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none"></select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Term</label>
                <select id="filter-term" class="px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none"></select>
            </div>
            <button id="load-btn" class="bg-amber-500 text-slate-950 hover:bg-amber-600 font-bold px-5 py-2 rounded-lg transition-all">
                <i class="fa-solid fa-magnifying-glass mr-1"></i> Load Report
            </button>
            <button id="print-btn" class="bg-slate-900 text-white hover:bg-slate-800 font-bold px-5 py-2 rounded-lg transition-all">
                <i class="fa-solid fa-print mr-1"></i> Print
            </button>
            <button id="pdf-btn" class="bg-green-700 text-white hover:bg-green-800 font-bold px-5 py-2 rounded-lg transition-all">
                <i class="fa-solid fa-file-pdf mr-1"></i> Download PDF
            </button>
        </div>

        <div id="report-content" class="report-shell hidden">
            <div id="report-inner"></div>
        </div>
    </main>

    <script src="js/dashboard.js"></script>
    <script>
        if (!requireRole('student', 'parent')) throw new Error('Redirecting');

        const user = getUser();
        const isParent = user.role === 'parent';
        document.getElementById('nav-username').textContent = user.full_name;
        document.getElementById('nav-username').classList.remove('hidden');

        let currentChildId = null;

        function getRemark(grade) {
            const map = { A: 'Distinction', B: 'Very Good', C: 'Good', D: 'Average', E: 'Pass', F: 'Fail' };
            return map[grade] || '-';
        }

        function getDomainLabel(val) {
            if (!val) return '-';
            const labels = { A: 'Excellent', B: 'V. Good', C: 'Good', D: 'Fair', E: 'Needs Imp.' };
            return labels[val.toUpperCase()] || val;
        }

        function rcBadgeClass(grade) {
            if (!grade) return '';
            const g = String(grade).trim().toUpperCase();
            return ['A', 'B', 'C', 'D', 'E', 'F'].includes(g) ? ' rc-badge--' + g.toLowerCase() : '';
        }

        function renderReport(data) {
            const s = data.student;
            const term = data.term;
            const session = data.session;
            const results = data.results || [];
            const domain = data.domains || {};
            const summary = data.summary;
            const attendance = data.attendance || { present: 0, absent: 0, excused: 0 };
            const meta = data.report_meta || {};

            const domainFields = [
                { label: 'Punctuality', key: 'punctuality' },
                { label: 'Attentiveness', key: 'attentiveness' },
                { label: 'Neatness', key: 'neatness' },
                { label: 'Honesty', key: 'honesty' },
                { label: 'Politeness', key: 'politeness' },
                { label: 'Self Control', key: 'self_control' },
                { label: 'Handwriting', key: 'handwriting' },
                { label: 'Sports', key: 'sports' },
                { label: 'Drawing', key: 'drawing' },
                { label: 'Verbal Fluency', key: 'verbal_fluency' },
                { label: 'Craft Skills', key: 'craft_skills' },
                { label: 'Thinking Ability', key: 'thinking_ability' },
                { label: 'Social Skills', key: 'social_skills' },
            ];

            const domainHtml = domainFields.map(f => {
                const rawVal = domain[f.key] || '-';
                return `<div class="rc-domain" title="${escapeHtml(getDomainLabel(rawVal))}">
                    <span>${f.label}</span>
                    <strong class="rc-badge${rcBadgeClass(rawVal)}">${escapeHtml(rawVal)}</strong>
                </div>`;
            }).join('');

            const rows = results.map((r, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td class="rc-subject">${escapeHtml(r.subject_name)}</td>
                    <td>${escapeHtml(r.test1 ?? '-')}</td>
                    <td>${escapeHtml(r.test2 ?? '-')}</td>
                    <td>${escapeHtml(r.test3 ?? '-')}</td>
                    <td>${escapeHtml(r.ca_score ?? '-')}</td>
                    <td>${escapeHtml(r.exam_score ?? '-')}</td>
                    <td><strong>${escapeHtml(r.total_score ?? '-')}</strong></td>
                    <td><span class="rc-badge${rcBadgeClass(r.grade)}">${escapeHtml(r.grade || '-')}</span></td>
                    <td>${escapeHtml(r.remarks || getRemark(r.grade))}</td>
                </tr>`).join('');

            const grandTotal = results.reduce((sum, r) => sum + parseFloat(r.total_score || 0), 0);
            const avg = results.length > 0 ? (grandTotal / results.length) : 0;
            const nextTerm = meta.next_term_begins ? new Date(meta.next_term_begins).toDateString() : '________________';

            document.getElementById('report-inner').innerHTML = `
                <article class="rc">
                    <div class="rc-head">
                        <img src="freppa logo.svg.png" alt="School Logo" class="rc-logo">
                        <div class="rc-head-text">
                            <h1>FREPPA GROUP OF SCHOOLS</h1>
                            <p>19, Bethel Street, Aule Rd, Akure, Ondo</p>
                            <p>Phone: +234 806 905 2278 &nbsp;|&nbsp; Email: info@freppagroupofschools.edu</p>
                        </div>
                        <div class="rc-tag">OFFICIAL<br>REPORT</div>
                    </div>

                    <div class="rc-title">
                        <strong>REPORT CARD</strong>
                        <span>${escapeHtml(term?.term_name || '-')} &nbsp;&bull;&nbsp; ${escapeHtml(session?.session_name || '-')}</span>
                    </div>

                    <div class="rc-info">
                        <div class="rc-info-item"><span>Student</span><strong>${escapeHtml(s?.full_name || '-')}</strong></div>
                        <div class="rc-info-item"><span>Admission No.</span><strong>${escapeHtml(s?.admission_number || '-')}</strong></div>
                        <div class="rc-info-item"><span>Class</span><strong>${escapeHtml(s?.class_name || '-')}${s?.section ? ' - ' + escapeHtml(s.section) : ''}</strong></div>
                        <div class="rc-info-item"><span>Gender</span><strong>${s?.gender ? escapeHtml(s.gender.charAt(0).toUpperCase() + s.gender.slice(1)) : '-'}</strong></div>
                        <div class="rc-info-item"><span>Term</span><strong>${escapeHtml(term?.term_name || '-')}</strong></div>
                        <div class="rc-info-item"><span>Session</span><strong>${escapeHtml(session?.session_name || '-')}</strong></div>
                    </div>

                    <table class="rc-table">
                        <colgroup>
                            <col style="width:4%"><col style="width:22%"><col style="width:7%"><col style="width:7%"><col style="width:7%">
                            <col style="width:8%"><col style="width:8%"><col style="width:8%"><col style="width:6%"><col style="width:23%">
                        </colgroup>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Subject</th>
                                <th>T1<br>(10)</th>
                                <th>T2<br>(20)</th>
                                <th>T3<br>(20)</th>
                                <th>CA<br>(50)</th>
                                <th>Exam<br>(50)</th>
                                <th>Total<br>(100)</th>
                                <th>Grade</th>
                                <th>Remarks</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows || '<tr><td colspan="10" class="rc-empty">No results found.</td></tr>'}
                        </tbody>
                    </table>

                    <div class="rc-summary">
                        <div class="rc-stat"><b>${summary?.subject_count || 0}</b><span>Subjects</span></div>
                        <div class="rc-stat"><b>${grandTotal.toFixed(2)}</b><span>Grand Total</span></div>
                        <div class="rc-stat"><b>${avg.toFixed(2)}</b><span>Average</span></div>
                        <div class="rc-stat"><b>${escapeHtml(meta.class_position || '-')}<small>/${escapeHtml(meta.total_students || '-')}</small></b><span>Position</span></div>
                    </div>

                    <div class="rc-lower">
                        <div>
                            <div class="rc-panel">
                                <h2>Affective &amp; Psychomotor Domains</h2>
                                <div class="rc-domain-grid">${domainHtml}</div>
                                <div class="rc-legend">
                                    <span>A = Excellent</span><span>B = Very Good</span><span>C = Good</span>
                                    <span>D = Fair</span><span>E = Needs Improvement</span>
                                </div>
                            </div>
                            <div class="rc-panel">
                                <h2>Attendance</h2>
                                <div class="rc-attendance">
                                    <span><strong>Present:</strong> ${escapeHtml(attendance.present)}</span>
                                    <span><strong>Absent:</strong> ${escapeHtml(attendance.absent)}</span>
                                    <span><strong>Excused:</strong> ${escapeHtml(attendance.excused)}</span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <div class="rc-panel">
                                <h2>Remarks &amp; Promotion</h2>
                                <div class="rc-remark-row"><span>Teacher's Remark</span><strong>${escapeHtml(summary?.teacher_remark || '-')}</strong></div>
                                <div class="rc-remark-row"><span>Promotion Status</span><strong>${escapeHtml(summary?.promotion_status || '-')}</strong></div>
                                <div class="rc-remark-row"><span>Class Teacher</span><strong>${escapeHtml(meta.teacher_remark || '____________________')}</strong></div>
                                <div class="rc-remark-row"><span>Principal's Remark</span><strong>${escapeHtml(meta.principal_remark || '____________________')}</strong></div>
                                <div class="rc-remark-row"><span>Next Term Begins</span><strong>${escapeHtml(nextTerm)}</strong></div>
                            </div>
                            <div class="rc-sign">
                                <div>
                                    <p>Class Teacher's Signature</p>
                                    <span>Date: ______________</span>
                                </div>
                                <div>
                                    <p>Principal's Signature</p>
                                    <span>Date: ______________</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="rc-foot">This is a computer-generated report card from FREPPA Group of Schools Portal</div>
                </article>
            `;
        }

        function fitReportToPage() {
            const paper = document.querySelector('#report-inner .rc');
            if (!paper) return;
            paper.style.zoom = '';
            paper.style.width = '';
            const availableHeight = 1115;
            const contentHeight = paper.getBoundingClientRect().height;
            if (contentHeight > availableHeight) {
                const scale = Math.max(0.5, availableHeight / contentHeight);
                paper.style.zoom = String(scale);
                paper.style.width = (100 / scale) + '%';
            }
        }

        function resetReportFit() {
            const paper = document.querySelector('#report-inner .rc');
            if (!paper) return;
            paper.style.zoom = '';
            paper.style.width = '';
        }

        window.addEventListener('beforeprint', fitReportToPage);
        window.addEventListener('afterprint', resetReportFit);

        async function loadReport() {
            const sessionId = document.getElementById('filter-session').value;
            const termId = document.getElementById('filter-term').value;
            const loading = document.getElementById('loading-message');
            const content = document.getElementById('report-content');
            const error = document.getElementById('error-message');

            loading.classList.remove('hidden');
            content.classList.add('hidden');
            error.classList.add('hidden');

            try {
                let endpoint;
                if (isParent && currentChildId) {
                    endpoint = `/api/report/child/${currentChildId}/card?term_id=${termId}&session_id=${sessionId}`;
                } else {
                    endpoint = `/api/report/card?term_id=${termId}&session_id=${sessionId}`;
                }
                const data = await apiFetch(endpoint);
                renderReport(data);
                loading.classList.add('hidden');
                content.classList.remove('hidden');
            } catch (e) {
                loading.classList.add('hidden');
                error.textContent = e.message;
                error.classList.remove('hidden');
            }
        }

        async function downloadPDF() {
            const sessionId = document.getElementById('filter-session').value;
            const termId = document.getElementById('filter-term').value;

            try {
                let url;
                if (isParent && currentChildId) {
                    url = `${API_BASE}/api/report/child/${currentChildId}/card/pdf?term_id=${termId}&session_id=${sessionId}`;
                } else {
                    url = `${API_BASE}/api/report/card/pdf?term_id=${termId}&session_id=${sessionId}`;
                }
                const token = getToken();
                const res = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Failed to generate PDF');
                }
                const blob = await res.blob();
                const blobUrl = URL.createObjectURL(blob);
                window.open(blobUrl, '_blank');
                setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
            } catch (e) {
                document.getElementById('error-message').textContent = e.message;
                document.getElementById('error-message').classList.remove('hidden');
            }
        }

        async function loadFilters() {
            try {
                const data = await apiFetch('/api/student/results');
                const sessionSelect = document.getElementById('filter-session');
                const termSelect = document.getElementById('filter-term');

                sessionSelect.innerHTML = '<option value="">-- Select --</option>';
                termSelect.innerHTML = '<option value="">-- Select --</option>';

                (data.sessions || []).forEach(s => {
                    sessionSelect.innerHTML += `<option value="${s.id}" ${s.is_current ? 'selected' : ''}>${s.session_name}</option>`;
                });
                (data.terms || []).forEach(t => {
                    termSelect.innerHTML += `<option value="${t.id}" ${t.is_current ? 'selected' : ''}>${t.term_name}</option>`;
                });

                const selSession = sessionSelect.value;
                const selTerm = termSelect.value;
                if (selSession && selTerm) {
                    loadReport();
                }
            } catch (e) {
                console.error('Failed to load filters:', e);
            }
        }

        document.getElementById('load-btn').addEventListener('click', loadReport);
        document.getElementById('print-btn').addEventListener('click', () => window.print());
        document.getElementById('pdf-btn').addEventListener('click', downloadPDF);

        document.getElementById('filter-session').addEventListener('change', () => {
            if (document.getElementById('filter-session').value && document.getElementById('filter-term').value) {
                loadReport();
            }
        });
        document.getElementById('filter-term').addEventListener('change', () => {
            if (document.getElementById('filter-session').value && document.getElementById('filter-term').value) {
                loadReport();
            }
        });

        loadFilters();
    </script>
</body>
</html>
