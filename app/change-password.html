<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | FREPPA GROUP OF SCHOOLS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
    <style>
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <header class="sticky top-0 z-40 bg-green-800 text-white">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3">
                <img src="freppa logo.svg.png" alt="Logo" class="w-10 h-10 object-contain">
                <span class="font-bold text-sm md:text-xl tracking-tight">FREPPA GROUP OF SCHOOLS</span>
            </a>
            <div class="flex items-center space-x-4">
                <span id="nav-username" class="text-sm text-amber-400 font-medium hidden"></span>
                <a id="back-link" href="index.html" class="text-sm text-slate-100 hover:text-amber-400 transition-colors">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Back
                </a>
                <button onclick="logout()" class="text-sm text-slate-100 hover:text-amber-400 transition-colors">
                    <i class="fa-solid fa-sign-out-alt mr-1"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
            <h1 class="text-2xl font-bold text-slate-900 text-center">Change Password</h1>
            <p class="text-slate-500 text-sm text-center mt-1 mb-6">Use at least 8 characters with a letter and a number.</p>

            <div id="error-message" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm mb-4"></div>
            <div id="success-message" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg text-sm mb-4"></div>

            <form id="password-form" class="space-y-4">
                <div>
                    <label for="current-password" class="block text-sm font-semibold text-slate-700 mb-1">Current Password</label>
                    <input type="password" id="current-password" required autocomplete="current-password"
                           class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all">
                </div>
                <div>
                    <label for="new-password" class="block text-sm font-semibold text-slate-700 mb-1">New Password</label>
                    <input type="password" id="new-password" required autocomplete="new-password" minlength="8"
                           class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all">
                </div>
                <div>
                    <label for="confirm-password" class="block text-sm font-semibold text-slate-700 mb-1">Confirm New Password</label>
                    <input type="password" id="confirm-password" required autocomplete="new-password" minlength="8"
                           class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all">
                </div>
                <button type="submit" id="submit-btn"
                        class="w-full bg-amber-500 text-slate-950 hover:bg-amber-600 font-bold py-3 rounded-lg transition-all duration-300">
                    Update Password
                </button>
            </form>
        </div>
    </main>

    <script src="js/dashboard.js"></script>
    <script>
        if (requireAuth()) {
            const user = getUser();
            document.getElementById('nav-username').textContent = user.full_name;
            document.getElementById('nav-username').classList.remove('hidden');

            const dashboards = {
                admin: 'admin-dashboard.html',
                teacher: 'teacher-dashboard.html',
                student: 'student-dashboard.html',
                parent: 'student-dashboard.html'
            };
            document.getElementById('back-link').href = dashboards[user.role] || 'index.html';
        }

        document.getElementById('password-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const errorEl = document.getElementById('error-message');
            const successEl = document.getElementById('success-message');
            const btn = document.getElementById('submit-btn');
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');

            if (newPassword !== confirmPassword) {
                errorEl.textContent = 'New passwords do not match.';
                errorEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating...';

            try {
                const data = await apiFetch('/api/auth/change-password', {
                    method: 'POST',
                    body: JSON.stringify({ current_password: currentPassword, new_password: newPassword })
                });
                document.getElementById('password-form').reset();
                successEl.textContent = data.message || 'Password updated successfully.';
                successEl.classList.remove('hidden');
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Update Password';
            }
        });
    </script>
</body>
</html>
